version: 2

updates:
  # npm deps
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        update-types:
          - patch
          - minor

  # docker deps
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      patch-minor:
        update-types:
          - patch
          - minor